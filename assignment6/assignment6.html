<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page header with flexbox</title>
    <style>
        .nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #12203a;
            color:white;

        }
        nav ul{
            display: flex;
            gap: 20px;
            list-style: none;
        }
        nav a{
            background-color: #12203a;
            color: white;
            text-decoration: none;
        }
        .cards{
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 24px;
        }
        .card{
            flex: 1 1 200px;
            background: #eef2ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav>
        <h2>coding</h2>
        <ul>
            <li><a href="#">home</a></li>
           <li><a href="#">cource</a></li>
           <li><a href="#">contact</a></li>
        </ul>
        <button class="btn">sign up</button>
        <section class="cards">
            <div class="card"><h3>HTML</h3><p>build the structure</p></div>
            <div class="card"><h3>CSS</h3><p>make it beautiful</p></div>
            <div class="card"><h3>javascript</h3><p>make it smart</p></div>
            <div class="card"><h3>git</h3><p>save your work</p></div>
        </section>
    </nav>
</body>
</html>
